<style>
  :root {
    --bg: #0E0E0D;
    --fg: #F2F0EB;
    --muted: #B8B4AC;
    --dim: #8C8880;
    --faint: #5C5A54;
    --accent: #C98D5B;
    --accent-hover: #E2A876;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
  }

  body {
    min-height: 100vh;
    position: relative;
    color: var(--fg);
    font-family: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
    padding: 96px 24px;
  }

  .mark {
    display: block;
    width: clamp(150px, 20vw, 260px);
    height: auto;
    margin: 0 auto;
  }

  .mark path {
    fill: var(--fg);
  }

  .statement {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    transform: translateY(-50%);
    display: flex;
    justify-content: center;
    padding: 0 24px;
  }

  .statement p {
    margin: 0;
    max-width: 90vw;
    font-size: clamp(13px, 1.6vw, 16px);
    line-height: 1.6;
    color: var(--muted);
    text-align: center;
  }

  @media (max-width: 560px) {
    .statement p { white-space: normal; }
  }
  @media (min-width: 561px) {
    .statement p { white-space: nowrap; }
  }

  .cta {
    position: absolute;
    bottom: 68px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 14px;
    color: var(--dim);
  }

  .cta a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(201, 141, 91, 0.4);
  }

  .cta a:hover {
    color: var(--accent-hover);
    border-bottom-color: rgba(226, 168, 118, 0.7);
  }

  .footer {
    position: absolute;
    bottom: 32px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--faint);
  }
</style>
</head>
